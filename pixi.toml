[workspace]
authors = ["Chenhao Ding <chenhao.ding@tum.de>"]
channels = ["conda-forge", "main", "r", "msys2", "gurobi"]
name = "fleetpy"
platforms = ["osx-arm64", "linux-64", "win-64"]
version = "0.1.0"

[tasks]
run_examples = "python run_examples.py"

[dependencies]
pip = "25.0.*"
numpy = "2.2.*"
plotly = "5.24.*"
python = "3.10.*"
scipy = "1.15.*"
fiona = "==1.10.1"
geopandas = "==1.0.1"
pandas = "==2.2.3"
pyogrio = "==0.10.0"
pyproj = "==3.7.0"
pyyaml = "==6.0.2"
rtree = "==1.3.0"
shapely = "==2.0.6"
tqdm = "==4.67.1"
matplotlib = "*"
requests = "*"
ipykernel = "*"
gurobi = ">=13.0.1,<14"

[pypi-dependencies]
cython = "==3.0.11"
dill = "==0.3.9"
nbformat = ">=4.2.0"
