  stop_based:
    op_module: StopBasedBatchAssignmentFleetcontrol
    use_all_nodes_boarding: true
    op_vr_control_func_dict:
      func_key: distance_and_user_times_man
      vot: 0.458
      dc: 0.05
    veh_type: default_vehtype  # TODO bigger vehicle types for stop-based service?
    fleet_ratios: [0.25]  # 0.5, 1.0

  dtd:
    op_module: RidePoolingBatchAssignmentFleetcontrol
    op_vr_control_func_dict: # TODO (sod) func_key:distance_and_user_times_man_SoD;vot:0.458;dc:0.05;fr:1000000
      func_key: distance_and_user_times_man
      vot: 0.458
      dc: 0.05
    veh_type: default_vehtype
    # fleet_ratios: [0.1, 0.25, 0.5, 1.0]   # vehicles per total Λ (pax/h); e.g. 0.25 * 200pax/h = 50 vehs
    fleet_ratios: [0.25]  # 0.5, 1.0

simulation:
  end_time: 3600        # demand generation window (s)
  cool_time: 1800       # extra sim time after demand stops, to let in-progress trips finish (s)

