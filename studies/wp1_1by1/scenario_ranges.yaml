network:
  lengths: [1]  # 1, 5, 10, 15         # corridor lengths (km)
  widths: [1]  # 1, 1.4, 1.8, 2          # corridor widths (km)
  num_hubs: [1, 2]       # number of hubs; 2 hubs -> two SoD half-lines (each hub -> corridor midpoint and back)
  cell_size: 100        # grid node spacing (m)
  default_speed: 30     # default speed (km/h)
  boarding_point_spacing_m: 300  # constant spacing between stop-based boarding points (m)

demand:
  areal_densities: [15, 30, 45]  # 100, 500, 1000 # demand density in pax/km²/h; total Λ = density × corridor_length_km × corridor_width_km
  seeds: [0]  # 0, 1, 2  # random seeds for demand generation
  spatial_distributions:
    # multicentric: demand density concentrated around the hub(s). Cutoffs are derived in code.
    #   hub_triangular    : triangular along the corridor length (1 hub -> whole corridor, 2 hubs ->
    #                       peaks meet at the midpoint), uniform across the width.
    #   hub_triangular_2d : also triangular across the width (peaks at the hub row, zero at the edges).
    ["uniform", "hub_triangular_2d"]
  temporal_distributions:
    ["poisson"]

  # Behavioral parameters consumed by UserGroupRequest (per-request columns).
  user_group_params:
    normal:
      user_max_wait_time: 600            # seconds
      max_rel_detour: 40                 # percent of direct route travel time
      max_walking_dist: 500              # meters
      walking_speed: 5                   # kilometers/hour
      value_of_time: 10                  # euro/hour
      value_of_walking_factor: 2         # value of walking time relative to in-vehicle time
      value_of_waiting_factor: 1.5       # value of waiting time relative to in-vehicle time
      no_offer_penalty: 0                # disutility when no offer is acceptable

    mobility_constrained:
      user_max_wait_time: 300            # seconds
      max_rel_detour: 40                 # percent of direct route travel time
      max_walking_dist: 300              # meters
      walking_speed: 3                   # kilometers/hour
      value_of_time: 10                  # euro/hour
      value_of_walking_factor: 3         # value of walking time relative to in-vehicle time
      value_of_waiting_factor: 2         # value of waiting time relative to in-vehicle time
      no_offer_penalty: 0                # disutility when no offer is acceptable

    weather_safety_sensitive:
      user_max_wait_time: 600            # seconds
      max_rel_detour: 40                 # percent of direct route travel time
      max_walking_dist: 500              # meters
      walking_speed: 5                   # kilometers/hour
      value_of_time: 10                  # euro/hour
      value_of_walking_factor: 3         # value of walking time relative to in-vehicle time
      value_of_waiting_factor: 2         # value of waiting time relative to in-vehicle time
      no_offer_penalty: 0                # disutility when no offer is acceptable

    time_sensitive:
      user_max_wait_time: 300            # seconds
      max_rel_detour: 30                 # percent of direct route travel time
      max_walking_dist: 300              # meters
      walking_speed: 6                   # kilometers/hour
      value_of_time: 15                  # euro/hour
      value_of_walking_factor: 2         # value of walking time relative to in-vehicle time
      value_of_waiting_factor: 1.5       # value of waiting time relative to in-vehicle time
      no_offer_penalty: 0                # disutility when no offer is acceptable

    relaxed:
      user_max_wait_time: 900            # seconds
      max_rel_detour: 60                 # percent of direct route travel time
      max_walking_dist: 800              # meters
      walking_speed: 4                   # kilometers/hour
      value_of_time: 5                   # euro/hour
      value_of_walking_factor: 1.5       # value of walking time relative to in-vehicle time
      value_of_waiting_factor: 1.0       # value of waiting time relative to in-vehicle time
      no_offer_penalty: 0                # disutility when no offer is acceptable

  # Population mix profiles (shares must sum to 1.0 per profile).
  # TODO complete
  user_profiles:
    all_normal:
      normal: 1.0
      directionality: [0.5]

    # time_sensitive_half:
    #   time_sensitive: 0.5
    #   relaxed: 0.5
    #   directionality: [0.5]

    # time_sensitive_majority:
    #   time_sensitive: 0.75
    #   relaxed: 0.25
    #   # directionality: [0.25, 0.5, 0.75]
    #   directionality: [0.5]

    # mobility_constrained_5:
    #   mobility_constrained: 0.05
    #   normal: 0.95
    #   # directionality: [0.25, 0.5, 0.75]
    #   directionality: [0.5]
    
    mobility_constrained_10:
      mobility_constrained: 0.1
      normal: 0.9
      # directionality: [0.25, 0.5, 0.75]
      directionality: [0.5]

    # mobility_constrained_15:
    #   mobility_constrained: 0.15
    #   normal: 0.85
    #   # directionality: [0.25, 0.5, 0.75]
    #   directionality: [0.5]

    # mobility_constrained_20:
    #   mobility_constrained: 0.2
    #   normal: 0.8
    #   # directionality: [0.25, 0.5, 0.75]
    #   directionality: [0.5]


pubtrans:
  headways_min: [1, 5, 10, 20]                    # headways in minutes
  station_spacings_m: [200, 300, 400, 500]     # stop spacings along the corridor line (m)
  boarding_time_s: 30                          # dwell time at each stop (s)
  vehicle_type: veh_20
  line_id: 1

service_types:
  sod:
    op_module: SemiOnDemandBatchAssignmentFleetcontrol
    op_vr_control_func_dict:
      func_key: distance_and_user_times_man_SoD
      vot: 0.458
      dc: 0.05
      fr: 1000000
    veh_type: veh_20
    fleet_ratios: [0.25] 
    headways_min: [5]              # must be a subset of pubtrans.headways_min above
    station_spacings_m: [200]       # must be a subset of pubtrans.station_spacings_m above
    fixed_length_fractions: [0.5, 0.75]
    line_id: 1
    pt_flex_detour: 2
    pt_zone_min_detour_time: 0
    pt_zone_max_detour_time: 600
    # A dispatch delay buffers the terminus departure so pending from-hub requests can attach to
    # it before the outbound leg locks; a diagnostic sweep on the sod scenario showed dd=0 caps
    # from-hub match rate ~38% while dd>=300 raises it to ~62% (see analyze_hub_boarding.py /
    # results/hub_boarding_sweep_dispatch_headway.csv). 300 matched dd=600's gains at lower wait.
    pt_dispatch_delay: 300

  fixed_line:
    op_module: SemiOnDemandBatchAssignmentFleetcontrol
    op_vr_control_func_dict:
      func_key: distance_and_user_times_man_SoD
      vot: 0.458
      dc: 0.05
      fr: 1000000
    veh_type: veh_20
    fleet_ratios: [0.25]
    headways_min: [5]
    station_spacings_m: [200]
    fixed_line: true
    line_id: 1
    pt_flex_detour: 2
    pt_zone_min_detour_time: 0       # disable flex dwell entirely (no flexible zone exists)
    pt_zone_max_detour_time: 0
    pt_dispatch_delay: 300           # see sod note above; buffers the terminus departure for from-hub boardings

  stops:
    op_module: RidePoolingBatchAssignmentFleetcontrol
    op_vr_control_func_dict:
      func_key: distance_and_user_times_with_walk
      vot: 0.458
      dc: 0.05
    veh_type: default_vehtype  # TODO bigger vehicle types for stop-based service?
    fleet_ratios: [0.25]  # 0.5, 1.0
    rq_type: StopBasedUserGroupRequest

  dtd:
    op_module: RidePoolingBatchAssignmentFleetcontrol
    op_vr_control_func_dict:
      func_key: distance_and_user_times_man
      vot: 0.458
      dc: 0.05
    veh_type: default_vehtype
    fleet_ratios: [0.25]  # 0.5, 1.0

simulation:
  end_time: 3600        # demand generation window (s)
  cool_time: 3600       # extra sim time after demand stops, to let in-progress trips finish (s)

